name: sparkkeeper

x-app-environment: &app-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 8080
  APP_VERSION: ${APP_VERSION:-development}
  APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
  DATA_DIR: /app/data
  BROWSER_PROFILE_DIR: /app/data/browser-profile
  BROWSER_HEADLESS: 'true'
  LOG_DIR: /app/data/logs
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-14}
  SCREENSHOT_RETENTION_DAYS: ${SCREENSHOT_RETENTION_DAYS:-14}
  TRACE_MODE: ${TRACE_MODE:-off}
  TRACE_RETENTION_DAYS: ${TRACE_RETENTION_DAYS:-7}
  SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
  SCHEDULER_ALLOW_REAL_SEND: ${SCHEDULER_ALLOW_REAL_SEND:-false}
  SCHEDULER_ACCOUNT_ID: ${SCHEDULER_ACCOUNT_ID:-}
  SCHEDULER_MESSAGE_TEMPLATE_ID: ${SCHEDULER_MESSAGE_TEMPLATE_ID:-}
  MANUAL_RUN_ENABLED: ${MANUAL_RUN_ENABLED:-false}
  SPARKKEEPER_ADMIN_SECURITY_MODE: production
  SPARKKEEPER_ADMIN_CANONICAL_ORIGIN: https://${SPARKKEEPER_DOMAIN:-sparkkeeper.invalid}
  SPARKKEEPER_ADMIN_TRUSTED_PROXY_CIDRS: 172.30.20.2/32

x-data-volume: &data-volume
  type: bind
  source: ${SPARKKEEPER_DATA_DIR:-./data}
  target: /app/data

services:
  edge:
    image: sparkkeeper-edge:local
    build:
      context: .
      dockerfile: docker/Dockerfile.caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SPARKKEEPER_DOMAIN: ${SPARKKEEPER_DOMAIN:-sparkkeeper.invalid}
      SPARKKEEPER_HSTS_MAX_AGE: ${SPARKKEEPER_HSTS_MAX_AGE:-0}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./docker/security.caddy:/etc/caddy/security.caddy:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      edge-public:
      frontend:
        ipv4_address: 172.30.10.2
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    depends_on:
      admin:
        condition: service_healthy
  app:
    image: sparkkeeper-app:local
    build:
      context: .
      target: app-runtime
    init: true
    restart: unless-stopped
    environment: *app-environment
    expose:
      - '8080'
    volumes:
      - *data-volume
    networks:
      backend:
        ipv4_address: 172.30.20.3
      app-egress:
    healthcheck:
      test: ['CMD', 'node', '/app/server/docker-healthcheck.mjs']
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 5
    # Accepted Manual Runs belong to the server lifecycle and may span several bounded browser steps.
    stop_grace_period: 10m
    security_opt:
      - no-new-privileges:true

  admin:
    image: sparkkeeper-admin:local
    build:
      context: .
      target: admin-runtime
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    expose: ['8080']
    networks:
      frontend:
        ipv4_address: 172.30.10.3
      backend:
        ipv4_address: 172.30.20.2
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/']
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    stop_grace_period: 20s
    security_opt:
      - no-new-privileges:true

  maintenance:
    image: sparkkeeper-maintenance:local
    build:
      context: .
      target: maintenance-runtime
    profiles:
      - maintenance
    init: true
    restart: 'no'
    environment:
      DATA_DIR: /app/data
      BROWSER_PROFILE_DIR: /app/data/browser-profile
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Shanghai}
      DISPLAY: :99
      NOVNC_SCREEN: ${NOVNC_SCREEN:-1440x900x24}
      NOVNC_PASSWORD_FILE: /run/secrets/novnc-password
    expose: ['6080']
    volumes:
      - *data-volume
      - type: bind
        source: ${NOVNC_PASSWORD_FILE:-./.secrets/novnc-password}
        target: /run/secrets/novnc-password
        read_only: true
        bind:
          create_host_path: false
    shm_size: 1gb
    healthcheck:
      test: ['CMD', 'node', '/app/server/maintenance-healthcheck.mjs']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    stop_grace_period: 40s
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    internal: true
    ipam:
      config: [{ subnet: 172.30.10.0/24 }]
  backend:
    internal: true
    ipam:
      config: [{ subnet: 172.30.20.0/24 }]
  edge-public:
  app-egress:
volumes:
  caddy-data:
  caddy-config:
